version: 1
protected_hosts:
  - chatgpt.com
  - chat.openai.com
  - claude.ai
  - gemini.google.com
  - copilot.microsoft.com
  - www.bing.com
  - api.openai.com
  - api.anthropic.com
  - generativelanguage.googleapis.com
  - api.githubcopilot.com
  - '*.githubcopilot.com'
max_text_chars: 50000
regex_timeout_seconds: 0.03
model:
  enabled: false
  base_url: http://127.0.0.1:8080/v1
  model: local-dlp
  timeout_seconds: 6
  labels: [PERSON, ORGANIZATION, CONFIDENTIAL]
rules:
  - id: private-key
    label: PRIVATE_KEY
    priority: 100
    pattern: '(?s)-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY-----.*?-----END (?:[A-Z0-9]+ )*PRIVATE KEY-----'
  - id: api-key
    label: API_KEY
    priority: 90
    pattern: '\b(?:sk-(?:proj-|ant-)?[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[A-Z0-9]{16}|AIza[A-Za-z0-9_-]{30,})\b'
  - id: assigned-secret
    label: SECRET
    priority: 90
    pattern: '(?i)\b(?:password|passwd|api[_-]?key|client[_-]?secret|access[_-]?token)\s*[:=]\s*["\x27]?[^\s"\x27,;]{6,}["\x27]?'
  - id: bearer-token
    label: ACCESS_TOKEN
    priority: 90
    pattern: '(?i)\bBearer\s+[A-Za-z0-9._~+/-]{12,}=*'
  - id: fenced-code
    label: SOURCE_CODE
    priority: 80
    pattern: '(?s)```.*?(?:```|\Z)'
  - id: email
    label: EMAIL
    priority: 20
    pattern: '(?i)(?<![\w.+-])[\w.+-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)+'
  - id: pesel
    label: PESEL
    priority: 30
    pattern: '(?<!\d)\d{11}(?!\d)'
    validator: pesel
  - id: polish-phone
    label: PHONE
    priority: 10
    pattern: '(?<!\d)(?:\+48[ -]?)?(?:\d{3}[ -]){2}\d{3}(?!\d)'
  - id: nip
    label: TAX_ID
    priority: 35
    pattern: '(?<!\d)\d{3}[- ]?\d{3}[- ]?\d{2}[- ]?\d{2}(?!\d)'
    validator: nip
  - id: polish-bank-account
    label: BANK_ACCOUNT
    priority: 40
    pattern: '(?<![A-Z0-9])(?:PL[ ]?)?\d{2}(?:[ ]?\d{4}){6}(?!\d)'
    validator: polish_iban
  - id: invoice-party
    label: INVOICE_PARTY
    priority: 25
    pattern: '(?im)^(?:Sprzedawca|Nabywca|Odbiorca|Buyer|Seller)\s*:\s*[^\r\n]+'
  - id: labeled-address
    label: ADDRESS
    priority: 25
    pattern: '(?im)^(?:Adres|Address)\s*:\s*[^\r\n]+'
  - id: internal-ip
    label: INTERNAL_IP
    priority: 10
    pattern: '\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'
  # Add your own literals or patterns. Use action: block for prohibited content.
  # - id: confidential-project
  #   label: PROJECT
  #   literal: Internal project name
  #   case_sensitive: false
